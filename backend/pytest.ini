[pytest]
testpaths = tests
addopts = -ra --strict-markers -m "not live_deepseek and not live_ollama"
markers =
    live_deepseek: chama a API real do DeepSeek (exige DEEPSEEK_API_KEY; rode com -m live_deepseek)
    live_ollama: chama um Ollama real em OLLAMA_URL (rode com -m live_ollama)
filterwarnings =
    ignore::DeprecationWarning
