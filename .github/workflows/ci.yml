# CI do Respostas de Nimb.
# Roda em todo PR para develop/main, em push no develop e é reaproveitado pelo CD
# (workflow_call) antes de qualquer deploy. Guia: manuais To Do/ci_cd_github_actions.md
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_call:
    secrets:
      DEEPSEEK_API_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  FRONT_DIR: "frontend/V2 - front Studio"

jobs:
  # CI-01..CI-08: testes da API com Google, DeepSeek e Ollama simulados
  backend-tests:
    name: API · testes (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt -c requirements.lock -r requirements-dev.txt
      - name: Rodar testes
        run: pytest --junitxml=test-results.xml
      - name: Publicar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  # Integrações reais: Ollama em service container e DeepSeek (só com o secret)
  live-integrations:
    name: Integrações · Ollama e DeepSeek reais
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      ollama:
        image: ollama/ollama:0.40.10
        ports:
          - 11434:11434
    env:
      OLLAMA_URL: http://localhost:11434
      OLLAMA_TEST_MODEL: all-minilm   # ~45 MB: prova a conexão sem baixar o bge-m3 (1,2 GB)
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -c requirements.lock -r requirements-dev.txt
      - name: Baixar modelo de teste no Ollama
        run: |
          for i in $(seq 1 30); do curl -fs "$OLLAMA_URL/api/tags" >/dev/null && break; sleep 2; done
          curl -fsS "$OLLAMA_URL/api/pull" -d "{\"model\": \"$OLLAMA_TEST_MODEL\", \"stream\": false}"
      - name: CI-04 Ollama real
        run: pytest -m live_ollama
      - name: CI-03 DeepSeek real
        if: env.DEEPSEEK_API_KEY != ''
        run: pytest -m live_deepseek

  frontend:
    name: Front · tipos e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONT_DIR }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONT_DIR }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Checagem de tipos (tsc)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Auditoria de dependências (produção)
        run: npm audit --omit=dev --audit-level=high

  # CI-08 em execução: sobe as imagens reais e confere as portas expostas
  docker-smoke:
    name: Docker · build e portas expostas
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v5
      - name: Preparar .env de teste
        run: |
          cp ../backend/.env.example ../backend/.env
          sed -i 's|^APP_SECRET_KEY=.*|APP_SECRET_KEY=ci-only-secret-0123456789abcdef|' ../backend/.env
          sed -i 's|^CORS_ORIGINS=.*|CORS_ORIGINS=http://localhost|' ../backend/.env
          cp .env.example .env
          mkdir -p ../vector_store
      - name: Build das imagens
        run: docker compose build
      - name: Subir
        run: docker compose up -d
      - name: Verificar portas e proteções
        run: bash ci/check-exposed-ports.sh
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down -v

  secret-scan:
    name: Segurança · segredos no histórico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
